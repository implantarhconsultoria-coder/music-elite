name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Expo install check
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript check
        run: npm run typecheck
